<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unauthorized — LocalFix</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>

  <!-- Body -->
<body style="background: var(--lf-muted);">
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="text-center p-4">
    <div id="unauthLogo" class="mb-4"></div>
    <i class="bi bi-shield-lock text-danger" style="font-size: 3.5rem;"></i>
    <h3 class="mt-3 mb-2 fw-bold">Access Denied</h3>
    <p class="text-muted mb-4">You don't have permission to view this page with your current account role.</p>
    <div class="d-flex justify-content-center gap-2">
      <button type="button" class="btn-lf-back" onclick="lfGoBack('../index.html')">
        <i class="bi bi-arrow-left"></i> <span>Go Back</span>
      </button>
      <a href="auth.html" class="btn btn-lf-primary btn-sm">Sign In With Another Account</a>
    </div>
  </div>
</div>

<script src="../js/sampleData.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const logo = document.getElementById('unauthLogo');
    if (logo) logo.innerHTML = lfBrandLogo(false);
  });
</script>
</body>
</html>
