<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — LocalFix</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<script>
  (function() {
    try {
      const t = localStorage.getItem("lf_theme") || "dark";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<script src="../js/i18n.js"></script>
</head>
<body style="background: var(--lf-muted);">

<div class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="text-center p-4">
    <div id="pageLogo" class="mb-4"></div>
    <div class="lf-display fw-bold" style="font-size: 5rem; color: var(--lf-primary);">404</div>
    <h3 class="mb-2 fw-bold" data-i18n="error.page_not_found">Page Not Found</h3>
    <p class="text-muted mb-4" data-i18n="error.page_not_found_desc">The page you are looking for does not exist or may have been moved.</p>
    <div class="d-flex justify-content-center align-items-center gap-2">
      <button type="button" class="btn-lf-back" onclick="lfGoBack('../index.html')">
        <i class="bi bi-arrow-left"></i> <span data-i18n="btn.back">Go Back</span>
      </button>
      <a href="../index.html" class="btn btn-lf-primary btn-sm" data-i18n="nav.back_to_home">Home Page</a>
      <button type="button" class="btn btn-sm lf-theme-toggle-btn border" id="themeToggleBtn" onclick="lfToggleTheme()" title="Toggle theme">
        <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
      </button>
    </div>
    <div class="mt-4 text-muted small">
      Need assistance? Contact our team: <a href="mailto:fixxlocal@gmail.com" class="text-decoration-none fw-semibold">fixxlocal@gmail.com</a>
    </div>
  </div>
</div>

<script src="../js/sampleData.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const logo = document.getElementById('pageLogo');
    if (logo) logo.innerHTML = lfBrandLogo(false);
  });
</script>
</body>
</html>
